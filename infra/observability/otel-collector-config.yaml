receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: basic

  prometheus:
    endpoint: 0.0.0.0:9464

  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp

  # Seq ingests OTLP over HTTP on its ingestion port (5341 inside the container);
  # the exporter appends /v1/logs and /v1/traces to this base path.
  otlphttp/seq:
    endpoint: http://seq:5341/ingest/otlp

service:
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlp/jaeger
        - otlp/tempo
        - otlphttp/seq
        - debug

    metrics:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - prometheus
        - debug

    logs:
      receivers:
        - otlp
      processors:
        - batch
      exporters:
        - otlphttp/loki
        - otlphttp/seq
        - debug
