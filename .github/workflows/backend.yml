name: backend

# Build and test the backend (unit + API integration tests), check that the EF Core model matches the
# migrations and build the API container image. Runs on Linux, which also catches path casing issues.
on:
  push:
    branches: [main]
    paths:
      - 'Backend/**'
      - 'global.json'
      - 'dotnet-tools.json'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'Backend/**'
      - 'global.json'
      - 'dotnet-tools.json'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Backend/SDC.CRM.Backend.slnf

      - name: Build
        run: dotnet build Backend/SDC.CRM.Backend.slnf --configuration Release --no-restore

      # Microsoft.Testing.Platform mode is enabled by global.json (required by TUnit on .NET 10 SDK).
      - name: Test (unit and API integration tests)
        run: dotnet test --solution Backend/SDC.CRM.Backend.slnf --configuration Release --no-build

      - name: EF Core model matches the migrations
        env:
          # Development settings satisfy the fail-fast checks of the design-time host; no database is contacted.
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project Backend/src/SDC.CRM.Infrastructure --startup-project Backend/src/SDC.CRM.Api --configuration Release --no-build

  docker-image:
    name: Build API container image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: Backend
          file: Backend/Dockerfile
          push: false
          tags: sdc-crm-api:ci

