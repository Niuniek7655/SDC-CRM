name: test-assets
on:
  pull_request:
    paths: ['doc/**', 'Backend/**', 'global.json', 'dotnet-tools.json', '.github/**', '.claude/**', '.cursor/**', '.github/workflows/test-assets.yml']
  push:
    branches: [main]
    paths: ['doc/**', 'Backend/**', 'global.json', 'dotnet-tools.json', '.github/**', '.claude/**', '.cursor/**', '.github/workflows/test-assets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation-and-smoke-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: Frontend/Web/.nvmrc
      - name: Validate domain documentation
        shell: pwsh
        run: ./doc/crm_ddd_ai_agent_package/tools/validate-docs.ps1
      - name: Parse PowerShell test scripts
        shell: pwsh
        run: |
          Get-ChildItem doc/testy -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Smoke runner rejects broken and incomplete responses
        run: node doc/testy/api/tests/test-smoke-runner.mjs
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SDC_CRM_TEST_POSTGRES: 'Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Integration tests against isolated PostgreSQL databases
        run: dotnet test --project Backend/tests/SDC.CRM.Api.IntegrationTests/SDC.CRM.Api.IntegrationTests.csproj -c Release --treenode-filter "/*/*/PostgresLeadRepositoryTests/*" --minimum-expected-tests 3
