name: dotnet-local-infra

# Local development infrastructure only - never use these defaults in production.
# Credentials fall back to development defaults; override them by copying
# .env.example to .env (git-ignored) next to this file.

services:
  postgres:
    image: postgres:17-alpine
    container_name: dotnet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dotnet-local-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: dotnet-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-app}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dotnet-local-network

  redis:
    image: redis:8-alpine
    container_name: dotnet-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dotnet-local-network

  # Observability images are pinned on purpose: ':latest' silently moved to new majors
  # (e.g. Tempo 3.x) whose configuration format differs from infra/observability/*.yaml.
  # Upgrade deliberately: bump the tag, read the release notes, adjust the config.
  seq:
    image: datalust/seq:2026.1.17182
    container_name: dotnet-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Local development only: no login required for the Seq UI/ingestion.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    networks:
      - dotnet-local-network

  loki:
    image: grafana/loki:3.7.8
    container_name: dotnet-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./infra/observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - dotnet-local-network

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: dotnet-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - dotnet-local-network

  grafana:
    image: grafana/grafana:13.2.2
    container_name: dotnet-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
      - jaeger
    networks:
      - dotnet-local-network

  # Jaeger v2 (successor of the discontinued jaegertracing/all-in-one v1 image):
  # OTLP receivers on 4317/4318 and the UI/query API on 16686, in-memory storage.
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    container_name: dotnet-jaeger
    restart: unless-stopped
    environment:
      # Listen on all interfaces so the collector container can reach the OTLP receivers.
      JAEGER_LISTEN_HOST: "0.0.0.0"
    ports:
      - "16686:16686"   # Jaeger UI
    networks:
      - dotnet-local-network

  # Tempo runs as a non-root user (10001), but a fresh named volume is owned by root.
  # This one-shot container fixes the volume ownership before Tempo starts.
  # (The Tempo image is distroless and has no chown, hence busybox.)
  tempo-init:
    image: busybox:1.37
    container_name: dotnet-tempo-init
    user: root
    entrypoint: ["chown", "-R", "10001:10001", "/tmp/tempo"]
    volumes:
      - tempo-data:/tmp/tempo
    networks:
      - dotnet-local-network

  tempo:
    image: grafana/tempo:2.10.8
    container_name: dotnet-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    ports:
      - "3200:3200"     # Tempo HTTP API
    volumes:
      - ./infra/observability/tempo-config.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    networks:
      - dotnet-local-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: dotnet-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/otel-collector-config.yaml"]
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "9464:9464"     # Prometheus scrape endpoint exposed by Collector
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otelcol-contrib/otel-collector-config.yaml:ro
    depends_on:
      - jaeger
      - tempo
      - loki
      - seq
    networks:
      - dotnet-local-network

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  seq-data:
  loki-data:
  prometheus-data:
  grafana-data:
  tempo-data:

networks:
  dotnet-local-network:
    driver: bridge
